services:
  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cdn_hotspot}
      MYSQL_USER: ${MYSQL_USER:-cdn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cdn_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
